name: "Contribution city"

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution calendar
        run: python tools/profile/fetch_city.py
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Render SVGs
        run: python tools/profile/render_city.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city.svg assets/status.svg assets/data/city.json
          git diff --cached --quiet || (git commit -m "chore: refresh contribution city" && git push)