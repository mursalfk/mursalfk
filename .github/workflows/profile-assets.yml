# ====================================================================
#  FILE PATH:  mursalfk/mursalfk/.github/workflows/profile-assets.yml
#  Replace the whole file at this path.
# ====================================================================
#
#  The previous version put two metrics steps in one job, so if the
#  first failed the second never ran and metrics-habits.svg was never
#  produced. They are separate jobs now, each with continue-on-error,
#  so one failing plugin cannot take the rest down.
#
#  IF NOTHING RUNS AT ALL, check these in order:
#
#  1. BRANCH NAME. This file must be on your DEFAULT branch. If yours
#     is master, change `branches: [main]` below, or Actions will never
#     trigger on push.
#  2. FILE PATH. It must be exactly .github/workflows/profile-assets.yml
#     A workflow in the wrong directory is silently ignored.
#  3. ACTIONS ENABLED. Settings → Actions → General → "Allow all actions".
#  4. THE SECRET. Settings → Secrets and variables → Actions must hold
#     METRICS_TOKEN. Without it the metrics steps fail immediately.
#     It must be a CLASSIC PAT (not fine-grained) with: read:user, repo.
#  5. WRITE PERMISSION. Settings → Actions → General → Workflow
#     permissions → "Read and write permissions". Without it the commit
#     step fails after generating the SVG, so you see a green-ish run
#     but no file.
#
#  Then open the Actions tab, pick "Profile assets", and use
#  "Run workflow". Read the failing step's log — it names the cause.

name: Profile assets

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics-main:
    name: Metrics · calendar and languages
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          base: header, repositories
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

  metrics-habits:
    name: Metrics · habits
    runs-on: ubuntu-latest
    steps:
      # habits needs `repo` scope on the PAT and enough recent events to
      # analyse. On a quiet account it can legitimately produce nothing,
      # which is one reason this is its own job.
      - uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-habits.svg
          base: ""
          config_timezone: Asia/Karachi
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  blog:
    name: Latest posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://dev.to/feed/mursalfk"
          max_post_count: 4
          # A real <br>. The old template emitted the literal two-character
          # sequence backslash-n, collapsing all posts onto one line.
          template: "- [$title]($url)<br>"
