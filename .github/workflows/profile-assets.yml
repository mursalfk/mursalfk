# ====================================================================
#  FILE PATH:  mursalfk/mursalfk/.github/workflows/profile-assets.yml
#  NEW FILE — create it at this path.
# ====================================================================
#
#  WHY THIS EXISTS
#  ---------------
#  github-readme-stats cards were failing to render. The cause is not
#  your setup: the public instance at github-readme-stats.vercel.app is
#  a single Vercel deployment serving millions of READMEs, and it
#  exhausts its rate limit most days. Anything pointed at it renders
#  intermittently, which looks worse than not having it.
#
#  The fix is to stop fetching images at page load. Every asset below is
#  generated by an Action and COMMITTED to this repo as a static file,
#  so the README loads them from GitHub itself. They can never fail to
#  render, never rate-limit, and never leak your traffic to a third
#  party.
#
#  SETUP
#  -----
#  1. Create a classic PAT with scopes: read:user, repo
#     (add read:org if you want organisation data)
#  2. Repo → Settings → Secrets and variables → Actions → New secret
#     Name: METRICS_TOKEN
#  3. Settings → Actions → General → Workflow permissions →
#     "Read and write permissions"
#  4. Run it once by hand from the Actions tab.

name: Profile assets

on:
  schedule:
    - cron: "0 2 * * *"      # daily, 02:00 UTC
  workflow_dispatch:          # and on demand
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    name: Metrics panels
    runs-on: ubuntu-latest
    steps:
      # ── Main panel: isometric calendar + languages ──────────────
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Karachi
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%

      # ── Second panel: habits and topics ─────────────────────────
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-habits.svg
          base: ""
          config_timezone: Asia/Karachi

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: mursalfk
          # Two outputs so the README can serve a different one to
          # light and dark readers via <picture>.
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  blog:
    name: Latest posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://dev.to/feed/mursalfk"
          max_post_count: 4
          # A real <br>, NOT the two-character sequence backslash-n.
          # The old template emitted literal \n, so all posts rendered
          # as one run-on line.
          template: "- [$title]($url)<br>"
