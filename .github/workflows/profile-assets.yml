# FILE PATH: mursalfk/mursalfk/.github/workflows/profile-assets.yml
#
# Snake + blog posts. Neither needs a PAT, so if this one fails the
# problem is the file or the repo settings, not your token.
#
# ASCII only, everything quoted. The previous version used middle-dot
# and box-drawing characters in job names and comments; harmless in
# theory, but not worth risking while debugging a parse error.

name: "Profile assets"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    name: "Contribution snake"
    runs-on: ubuntu-latest
    steps:
      - name: "Generate snake"
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: "mursalfk"
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: "Push to output branch"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: "output"
          build_dir: "dist"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  blog:
    name: "Latest posts"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Pull dev.to feed"
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://dev.to/feed/mursalfk"
          max_post_count: 4
          template: "- [$title]($url)<br>"
