# FILE PATH: mursalfk/mursalfk/.github/workflows/metrics.yml
#
# Kept separate from profile-assets.yml on purpose: this is the only
# workflow that needs METRICS_TOKEN, so if it fails while the other one
# succeeds, the cause is the token, not the YAML.
#
# BEFORE RUNNING
#   1. Create a CLASSIC personal access token (not fine-grained) with
#      scopes: read:user, repo
#   2. Settings > Secrets and variables > Actions > New repository secret
#      Name: METRICS_TOKEN
#   3. Settings > Actions > General > Workflow permissions >
#      "Read and write permissions"
#   4. Actions tab > Metrics > Run workflow

name: "Metrics"

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calendar:
    name: "Calendar and languages"
    runs-on: ubuntu-latest
    steps:
      - name: "Generate metrics"
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: "assets/metrics.svg"
          base: "header, repositories"
          config_timezone: "Asia/Karachi"
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: "full-year"
          plugin_languages: "yes"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_limit: 8

  habits:
    name: "Coding habits"
    runs-on: ubuntu-latest
    steps:
      - name: "Generate habits"
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: "assets/metrics-habits.svg"
          base: ""
          config_timezone: "Asia/Karachi"
          plugin_habits: "yes"
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: "yes"
          plugin_habits_charts: "yes"
